# Theme catalog (plan P6.2) — DATA ONLY. One row per shipped preset; every
# value is transcribed from packages/theme/tokens/presets/<id>/meta.yaml.
# packages/theme/test/catalog-parity.test.ts fails CI if either side drifts.
#
# Descriptive metadata, not behavior promises: attributes (palette_type,
# type_pairing, density, mood, motion) record the seed-derived CHARACTER of
# each look. Preset tokens are colors/type/spacing only — no preset ships
# animation or shadow behavior (momus P6.3 rider).
#
# Fixed taxonomy: palette_type × type_pairing × density × mood × motion.
# License provenance prose lives in each meta.yaml `source.attribution`;
# the full seed audit is ops/theme-seeds.yaml. Apply instructions:
# README.md next to this file.

presets:
  - id: agency-vivid
    title: Agency vivid
    verticals: [agency, marketing, smb]
    attributes:
      palette_type: light-white
      type_pairing: sans-display-sans-body
      density: roomy
      mood: energetic
      motion: subtle
    source:
      seed: https://github.com/arthelokyo/astrowind
      license: MIT
    screenshot: ops/catalog/screenshots/agency-vivid.png

